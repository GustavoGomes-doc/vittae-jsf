<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets">

<h:head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title><ui:insert name="titulo">Vittae</ui:insert></title>

	<link rel="stylesheet"
		href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com"
		crossorigin="true" />
	<link
		href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap"
		rel="stylesheet" />

	<h:outputStylesheet library="css" name="sistema.css" />
	<h:outputStylesheet library="css" name="admin.css" />
	<ui:insert name="css_extra"></ui:insert>
</h:head>

<body>
	<div class="dashboard-container">

		<aside class="sidebar">
		<div class="sidebar-logo">
			<i class="fas fa-stethoscope"></i> <span>Vittae</span>
		</div>

		<nav class="sidebar-nav"> <h:link outcome="/views/medicos/Inicio"
			styleClass="nav-item">
			<i class="fas fa-home"></i> Início
                    </h:link> <h:panelGroup>
			<!-- rendered="#{usuarioLogadoBean.perfil eq 'ADMIN'}"> -->
			<h:link outcome="/views/medicos/cadastrarMedico"
				styleClass="nav-item">
				<i class="fas fa-user-plus"></i> Cadastrar Médico
                        </h:link>
                        
		</h:panelGroup> <h:panelGroup rendered="#{usuarioLogadoBean.perfil eq 'PACIENTE'}">
			<h:link outcome="/views/pacientes/agendarConsulta"
				styleClass="nav-item">
				<i class="fas fa-calendar-plus"></i> Agendar Consulta
                        </h:link>
			<h:link outcome="/views/paciente/Historico" styleClass="nav-item">
				<i class="fas fa-history"></i> Meu Histórico
                        </h:link>
		</h:panelGroup> <h:panelGroup rendered="#{usuarioLogadoBean.perfil eq 'MEDICO'}">
			<h:link outcome="/views/medico/MinhaAgenda" styleClass="nav-item">
				<i class="fas fa-calendar-alt"></i> Minha Agenda
                        </h:link>
		</h:panelGroup> <h:link outcome="/views/comum/Perfil" styleClass="nav-item">
			<i class="fas fa-user-circle"></i> Meu Perfil
                    </h:link> </nav>

		</aside>
		<main class="main-content"> <header class="topbar" id="topbar">
		<div class="user-info">
			<div class="notifications">
				<i class="fas fa-bell"></i> <span class="badge">9+</span>
			</div>
			<img
				src="https://ui-avatars.com/api/?name=#{usuarioLogadoBean.nome}&amp;background=7c3aed&amp;color=fff"
				alt="Avatar" />
		</div>
		</header> <ui:insert name="corpo">
		</ui:insert> </main>
	</div>

	<!-- <h:outputScript library="js" name="Global.js" /> -->

	<ui:insert name="js_extra"></ui:insert>
</body>
</html>
