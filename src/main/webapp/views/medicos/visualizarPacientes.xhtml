<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://xmlns.jcp.org/jsf/passthrough">

<ui:composition template="/WEB-INF/template/LayoutPadrao.xhtml">

<ui:define name="titulo">Médicos | Meus Pacientes</ui:define>

    <ui:define name="css_extra">
        <h:outputStylesheet library="css" name="medico.css" />
        <h:outputStylesheet library="css" name="visualizar.css" />
    </ui:define>

    <ui:define name="corpo">

        <h:form id="formPacientes">

            <div class="page-header">
                <h2 class="page-title" style="color:#7c3aed;font-size:1.5rem;font-weight:700;">
                    <i class="fas fa-users" style="margin-right:8px"></i>Meus Pacientes
                </h2>
                <p class="page-subtitle">Histórico de todos os pacientes que já consultaram com você</p>
            </div>

            <div class="toolbar">
                <h:panelGroup layout="block" styleClass="search-wrap">
                    <i class="fas fa-search"></i>
                    <h:inputText id="filtroTexto"
                        value="#{meusPacientesBean.filtroTexto}"
                        styleClass="search-input"
                        p:placeholder="Buscar paciente ou especialidade...">
                        <f:ajax execute="@this" render="listaPacientesGroup contadorGroup"
   							 listener="#{meusPacientesBean.filtrar}" />
                    </h:inputText>
                </h:panelGroup>           
            </div>

            <h:panelGroup id="contadorGroup" layout="block" styleClass="contador-resultados">
                <h:outputText value="#{meusPacientesBean.totalFiltradas} paciente(s) encontrado(s)" />
            </h:panelGroup>

            <h:panelGroup id="listaPacientesGroup" layout="block">

                <h:panelGroup
                    rendered="#{empty meusPacientesBean.pacientesFiltrados}"
                    layout="block" styleClass="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-user-times" style="font-size:32px;color:#ede9fe"></i>
                    </div>
                    <h3 class="empty-title">Nenhuma consulta encontrada</h3>
                    <p class="empty-text">Não há registros para os critérios selecionados.</p>
                </h:panelGroup>

                <h:panelGroup
                    rendered="#{not empty meusPacientesBean.pacientesFiltrados}"
                    layout="block" styleClass="card">

                    <table class="tabela-dados">
					    <thead class="tabela-header">
					        <tr>
					            <th>Paciente</th>
					            <th>Data de Nascimento</th>
					            <th>Consultas</th>
					            <th>Responsável</th>
					        </tr>
					    </thead>
					    <tbody>
					        <ui:repeat value="#{meusPacientesBean.pacientesFiltrados}"
					            var="p" varStatus="loop">
					            <tr class="#{loop.index % 2 == 0 ? 'tabela-linha-par' : 'tabela-linha-impar'}">
					
					                <td>
					                    <div style="display:flex;align-items:center;gap:10px">
					                        <div style="width:34px;height:34px;border-radius:50%;
					                                    background:#ede9fe;display:flex;
					                                    align-items:center;justify-content:center;
					                                    color:#7c3aed;font-size:14px;flex-shrink:0">
					                            <i class="fas fa-user"></i>
					                        </div>
					                        <span style="font-weight:600;color:#1e293b">#{p.nome}</span>
					                    </div>
					                </td>
					
					                <td>
					                    <h:outputText value="#{p.dataNascimento}">
					                        <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
					                    </h:outputText>
					                    <h:outputText value="—" rendered="#{p.dataNascimento == null}" />
					                </td>
					
					                <td>
					                    <span style="font-weight:700;color:#7c3aed">#{p.qtdConsultas}</span>
					                </td>
					
					                <td>
					                    <h:outputText value="#{p.nomeResponsavel}" rendered="#{not empty p.nomeResponsavel}" />
					                    <h:outputText value="—" rendered="#{empty p.nomeResponsavel}" />
					                </td>
					
					            </tr>
					        </ui:repeat>
					    </tbody>
					</table>
                </h:panelGroup>
            </h:panelGroup>

        </h:form>
<script>
window.API_BASE_URL = 'http://44.197.126.129:8080/vittae'
</script>
    </ui:define>

</ui:composition>
</html>
