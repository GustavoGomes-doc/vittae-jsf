<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/template/LayoutPadrao.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://xmlns.jcp.org/jsf/passthrough">

    <ui:define name="css_extra">
        <h:outputStylesheet library="css" name="vizualizar.css" />
        <h:outputStylesheet library="css" name="medico.css" />
    </ui:define>

    <ui:define name="corpo">

        <h:messages id="mensagens" globalOnly="true"
            styleClass="info-messages" errorClass="error-messages"
            infoClass="success-messages" />

        <h:form id="formConsultasMedico">

            <!-- HEADER -->
            <div class="page-header">
                <h:panelGroup layout="block">
                    <h2 class="page-title">Consultas dos Pacientes</h2>
                    <p class="page-subtitle">Visualize seus agendamentos no sistema Vittae</p>
                </h:panelGroup>
            </div>

            <!-- TOOLBAR -->
            <div class="toolbar">
                <h:panelGroup layout="block" styleClass="search-wrap">
                    <i class="fas fa-search"></i>
                    <h:inputText id="filtroTexto"
                        value="#{visualizarConsultasMedicoBean.filtroTexto}"
                        styleClass="search-input"
                        p:placeholder="Buscar paciente ou especialidade...">
                        <f:ajax event="keyup" execute="@this"
                            render="listaConsultasGroup mensagens"
                            listener="#{visualizarConsultasMedicoBean.filtrar}" />
                    </h:inputText>
                </h:panelGroup>

                <div class="filter-tabs">
                    <h:commandButton value="Todas"
                        styleClass="filter-tab #{visualizarConsultasMedicoBean.filtroStatus == 'todas' ? 'active' : ''}">
                        <f:setPropertyActionListener
                            target="#{visualizarConsultasMedicoBean.filtroStatus}" value="todas" />
                        <f:ajax execute="@this" render="listaConsultasGroup mensagens"
                            listener="#{visualizarConsultasMedicoBean.filtrar}" />
                    </h:commandButton>

                    <h:commandButton value="Pendentes"
                        styleClass="filter-tab #{visualizarConsultasMedicoBean.filtroStatus == 'pendente' ? 'active' : ''}">
                        <f:setPropertyActionListener
                            target="#{visualizarConsultasMedicoBean.filtroStatus}" value="pendente" />
                        <f:ajax execute="@this" render="listaConsultasGroup mensagens"
                            listener="#{visualizarConsultasMedicoBean.filtrar}" />
                    </h:commandButton>

                    <h:commandButton value="Realizadas"
                        styleClass="filter-tab #{visualizarConsultasMedicoBean.filtroStatus == 'realizada' ? 'active' : ''}">
                        <f:setPropertyActionListener
                            target="#{visualizarConsultasMedicoBean.filtroStatus}" value="realizada" />
                        <f:ajax execute="@this" render="listaConsultasGroup mensagens"
                            listener="#{visualizarConsultasMedicoBean.filtrar}" />
                    </h:commandButton>

                    <h:commandButton value="Canceladas"
                        styleClass="filter-tab #{visualizarConsultasMedicoBean.filtroStatus == 'cancelada' ? 'active' : ''}">
                        <f:setPropertyActionListener
                            target="#{visualizarConsultasMedicoBean.filtroStatus}" value="cancelada" />
                        <f:ajax execute="@this" render="listaConsultasGroup mensagens"
                            listener="#{visualizarConsultasMedicoBean.filtrar}" />
                    </h:commandButton>
                </div>
            </div>

            <!-- LISTA -->
            <h:panelGroup id="listaConsultasGroup" layout="block">

                <h:panelGroup
                    rendered="#{empty visualizarConsultasMedicoBean.consultasFiltradas}"
                    layout="block" styleClass="empty-state">
                    <div class="empty-icon">
                        <i class="fas fa-calendar-times"
                            style="font-size: 32px; color: var(--vittae-purple);"></i>
                    </div>
                    <h3 class="empty-title">Nenhuma consulta encontrada</h3>
                    <h:outputText
                        value="Não há agendamentos para os critérios selecionados."
                        styleClass="empty-text" />
                </h:panelGroup>

                <h:panelGroup
                    rendered="#{not empty visualizarConsultasMedicoBean.consultasFiltradas}"
                    layout="block">
                    <ui:repeat value="#{visualizarConsultasMedicoBean.consultasFiltradas}"
                        var="consulta">

                        <h:panelGroup layout="block"
                            styleClass="consulta-card #{consulta.status.toString() == 'CANCELADA' ? 'consulta-cancelada' : ''}"
                            p:data-status="#{consulta.status.toString().toLowerCase()}"
                            p:data-paciente="#{consulta.nomePaciente}"
                            p:data-especialidade="#{consulta.especialidade}">

                            <!-- Card Header -->
                            <div class="card-header">
                                <h:panelGroup layout="block" styleClass="doctor-info">
                                    <div class="avatar">
                                        <i class="fas fa-user"></i>
                                    </div>
                                    <h:panelGroup layout="block">
                                        <div class="doctor-name">
                                            <h:outputText value="#{consulta.nomePaciente}" />
                                        </div>
                                        <div class="doctor-specialty">
                                            <i class="fas fa-stethoscope"></i>
                                            <h:outputText value="#{consulta.especialidade}" />
                                        </div>
                                    </h:panelGroup>
                                </h:panelGroup>

                                <h:panelGroup layout="block"
                                    styleClass="badge badge-#{consulta.status.toString().toLowerCase()}">
                                    <div class="badge-dot"></div>
                                    <h:outputText value="#{consulta.status}" />
                                </h:panelGroup>
                            </div>

                            <div class="card-divider"></div>

                            <!-- Detalhes -->
                            <div class="card-details">
                                <div class="detail-item">
                                    <span class="detail-label">
                                        <i class="fas fa-calendar-day"></i> Data
                                    </span>
                                    <h:outputText value="#{consulta.dataConsulta}"
                                        styleClass="detail-value">
                                        <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
                                    </h:outputText>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">
                                        <i class="fas fa-clock"></i> Horário
                                    </span>
                                    <h:outputText value="#{consulta.hora}"
                                        styleClass="detail-value">
                                        <f:convertDateTime type="localTime" pattern="HH:mm" />
                                    </h:outputText>
                                </div>
                            </div>

                            <!-- Ações -->
                            <div class="card-actions">
                                <h:commandButton value="Cancelar" styleClass="btn btn-cancel"
                                    rendered="#{consulta.status.toString() ne 'CANCELADA' and consulta.status.toString() ne 'REALIZADA'}">
                                    <f:ajax execute="@this" render="@form"
                                        listener="#{visualizarConsultasMedicoBean.prepararCancelamentoAction(consulta.id)}" />
                                </h:commandButton>
                            </div>

                        </h:panelGroup>
                    </ui:repeat>
                </h:panelGroup>
            </h:panelGroup>

            <!-- MODAL CANCELAMENTO -->
            <h:panelGroup id="modalCancelamento" layout="block" style="display:contents">
                <div class="modal-overlay"
                    style="#{visualizarConsultasMedicoBean.exibirModalCancelamento ? 'display:flex' : 'display:none'}">
                    <div class="modal-box">
                        <div class="modal-icon">
                            <i class="fas fa-exclamation-triangle"></i>
                        </div>
                        <h3 class="modal-title">Cancelar Consulta</h3>
                        <p class="modal-text">Tem certeza que deseja cancelar esta consulta?</p>
                        <div class="modal-actions">
                            <h:commandButton value="Voltar" styleClass="btn btn-secondary">
                                <f:ajax execute="@this" render="@form"
                                    listener="#{visualizarConsultasMedicoBean.fecharModal}" />
                            </h:commandButton>
                            <h:commandButton value="Sim, cancelar" styleClass="btn btn-confirmar-cancel">
                                <f:ajax execute="@this" render="@form"
                                    listener="#{visualizarConsultasMedicoBean.confirmarCancelamento}" />
                            </h:commandButton>
                        </div>
                    </div>
                </div>
            </h:panelGroup>

        </h:form>

        <h:outputScript library="js" name="visualizarMed.js" />
    </ui:define>
</ui:composition>
