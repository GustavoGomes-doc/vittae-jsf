<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://xmlns.jcp.org/jsf/passthrough">

    <ui:composition template="/WEB-INF/template/LayoutPadrao.xhtml">

        <ui:define name="corpo">
            
            <h:form id="formVisualizarConsultas">
                
                <section id="minhas-consultas" class="content-section active">
                    
                    <div class="page-header">
                        <div>
                            <h2 class="page-title">Minhas Consultas</h2>
                            <p class="page-subtitle">Gerencie e acompanhe seus agendamentos</p>
                        </div>
                        <h:link outcome="/agendar-consulta" styleClass="btn btn-primary">
                            <i class="fas fa-plus"></i> Nova Consulta
                        </h:link>
                    </div>

                    <div class="toolbar">
                        <div class="search-wrap">
                            <i class="fas fa-search"></i>
                            <h:inputText styleClass="search-input"
                                         value="#{visualizarConsultasBean.filtroTexto}"
                                         p:placeholder="Buscar por médico ou especialidade..."
                                         onkeyup="filtrar()"/>
                        </div>

                        <div class="filter-tabs">
                            <button type="button" class="filter-tab active" id="tab-todas" onclick="setFiltro('todas', this)">Todas</button>
                            <button type="button" class="filter-tab" id="tab-confirmadas" onclick="setFiltro('confirmadas', this)">Confirmadas</button>
                            <button type="button" class="filter-tab" id="tab-pendentes" onclick="setFiltro('pendentes', this)">Pendentes</button>
                            <button type="button" class="filter-tab" id="tab-concluidas" onclick="setFiltro('concluidas', this)">Concluídas</button>
                        </div>
                    </div>

                    <p class="results-count" id="results-count">
                        Exibindo <strong id="count-num"><h:outputText value="#{visualizarConsultasBean.consultas.size()}" /></strong> consultas
                    </p>

                    <div id="lista-consultas" class="appointment-container">
                        
                        <ui:repeat value="#{visualizarConsultasBean.consultas}" var="consulta">
                            
                            <div class="consulta-card" 
                                 data-status="#{consulta.status.toString().toLowerCase()}" 
                                 data-medico="#{consulta.medico.nome}" 
                                 data-especialidade="#{consulta.medico.especialidade}">
                                 
                                <div class="card-header">
                                    <div class="doctor-info">
                                        <div class="avatar">
                                            <i class="fas fa-user-md" style="color: white; font-size: 14px;"></i>
                                        </div>
                                        <div>
                                            <div class="doctor-name">#{consulta.medico.nome}</div>
                                            <div class="doctor-specialty">
                                                <i class="fas fa-stethoscope"></i> #{consulta.medico.especialidade}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <span class="badge badge-#{consulta.status.toString().toLowerCase()}">
                                        <span class="badge-dot"></span>#{consulta.status}
                                    </span>
                                </div>

                                <div class="card-divider"></div>

                                <div class="card-details">
                                    <div class="detail-item">
                                        <div class="detail-label">
                                            <i class="fas fa-calendar-day"></i> Data
                                        </div>
                                        <div class="detail-value">
                                            <h:outputText value="#{consulta.dataConsulta}">
                                                <f:convertDateTime type="localDate" pattern="dd MMM yyyy" />
                                            </h:outputText>
                                        </div>
                                    </div>
                                    
                                    <div class="detail-item">
                                        <div class="detail-label">
                                            <i class="fas fa-clock"></i> Horário
                                        </div>
                                        <div class="detail-value">#{consulta.hora}</div>
                                    </div>
                                    
                                    <div class="detail-item">
                                        <div class="detail-label">
                                            <i class="fas fa-dollar-sign"></i> Valor
                                        </div>
                                        <div class="detail-value price">
                                            <h:outputText value="#{consulta.valorConsulta}">
                                                <f:convertNumber type="currency" currencySymbol="R$" locale="pt_BR"/>
                                            </h:outputText>
                                        </div>
                                    </div>
                                    
                                    <div class="detail-item">
                                        <div class="detail-label">
                                            <i class="fas fa-map-marker-alt"></i> Local
                                        </div>
                                        <div class="detail-address">#{consulta.local}</div>
                                    </div>
                                </div>

                                <div class="card-actions">
                                    <button type="button" class="btn btn-cancel" onclick="cancelarConsulta(#{consulta.id})" 
                                            disabled="#{consulta.status eq 'CANCELADA' or consulta.status eq 'CONCLUIDA' ? 'disabled' : ''}">
                                        <i class="fas fa-times"></i> Cancelar
                                    </button>
                                    
                                    <button type="button" class="btn btn-reschedule" onclick="remarcarConsulta(#{consulta.id})"
                                            disabled="#{consulta.status eq 'CANCELADA' or consulta.status eq 'CONCLUIDA' ? 'disabled' : ''}">
                                        <i class="fas fa-redo"></i> Remarcar
                                    </button>
                                </div>
                            </div>
                            
                        </ui:repeat>

                    </div>
                </section>

            </h:form>

            <h:outputScript library="js" name="VisualizarConsulta.js" />

        </ui:define>
    </ui:composition>
</html>
