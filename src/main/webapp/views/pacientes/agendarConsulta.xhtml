<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://xmlns.jcp.org/jsf/passthrough">

    <ui:composition template="/WEB-INF/template/LayoutPadrao.xhtml">

        <ui:define name="corpo">

            <h:form id="formAgendamento">

                <section id="agendar" class="content-section active">
                    <div class="appointment-container">
                        <div class="appointment-header">
                            <h2>Agendamento de Consulta</h2>
                        </div>

                        <!-- ── BARRA DE PROGRESSO ── -->
                        <div class="progress-wrapper">
                            <div class="progress-steps">
                                <div class="step-item">
                                    <div class="step-circle active" id="circle1"><span>1</span></div>
                                    <span class="step-label">Consulta</span>
                                </div>
                                <div class="step-item">
                                    <div class="step-circle" id="circle2"><span>2</span></div>
                                    <span class="step-label">Médico</span>
                                </div>
                                <div class="step-item">
                                    <div class="step-circle" id="circle3"><span>3</span></div>
                                    <span class="step-label">Dados</span>
                                </div>
                            </div>
                            <div class="progress-line">
                                <div class="progress-fill" id="progressBar"><!-- --></div>
                            </div>
                        </div>
                        <br />

                        <!-- ── STEP 1: DADOS DA CONSULTA ── -->
                        <div class="form-step active" id="step1">
                            <h3>Dados da Consulta</h3>

                            <div class="form-group">
                                <label>Especialidade da consulta</label>
                                <h:selectOneMenu id="especialidadeType"
                                                 value="#{agendamentoBean.especialidade}"
                                                 styleClass="form-control">
                                    <f:selectItem itemValue="" itemLabel="Selecione..." />
                                    <f:selectItem itemValue="Cardiologia"    itemLabel="Cardiologia" />
                                    <f:selectItem itemValue="Neurologia"     itemLabel="Neurologia" />
                                    <f:selectItem itemValue="Alergologia"    itemLabel="Alergologia e Imunologia" />
                                    <f:selectItem itemValue="Urologia"       itemLabel="Urologia" />
                                    <f:selectItem itemValue="Ginecologia"    itemLabel="Ginecologia" />
                                    <f:selectItem itemValue="Radiologia"     itemLabel="Radiologia" />
                                    <f:selectItem itemValue="Dermatologia"   itemLabel="Dermatologia" />
                                    <f:selectItem itemValue="Pediatria"      itemLabel="Pediatria" />
                                    <f:selectItem itemValue="Ortopedia"      itemLabel="Ortopedia" />
                                    <f:selectItem itemValue="Clínico Geral"  itemLabel="Clínico Geral" />
                                </h:selectOneMenu>
                            </div>

                            <div class="form-group">
                                <label>Tipo de Consulta</label>
                                <h:selectOneMenu id="consultaType"
                                                 value="#{agendamentoBean.tipoConsulta}"
                                                 styleClass="form-control">
                                    <f:selectItem itemValue="" itemLabel="Selecione..." />
                                    <f:selectItem itemValue="rotina"   itemLabel="Consulta de Rotina" />
                                    <f:selectItem itemValue="retorno"  itemLabel="Retorno" />
                                    <f:selectItem itemValue="urgencia" itemLabel="Urgência" />
                                </h:selectOneMenu>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Data</label>
                                    <h:inputText id="consultaDate"
                                                 value="#{agendamentoBean.dataConsulta}"
                                                 styleClass="form-control"
                                                 p:type="date" />
                                </div>
                                <div class="form-group">
                                    <label>Horário</label>
                                    <h:inputText id="consultaTime"
                                                 value="#{agendamentoBean.horaConsulta}"
                                                 styleClass="form-control"
                                                 p:type="time" />
                                </div>
                            </div>
                        </div>

                        <!-- ── STEP 2: SELECIONAR MÉDICO ── -->
                        <div class="form-step" id="step2">
                            <div class="step-header-row">
                                <h3>Selecione o Médico</h3>
                                <input type="text" id="searchInput"
                                       placeholder="Buscar..." class="search-input" />
                            </div>

                            <!-- Campo oculto: JS coloca o id do médico aqui ao clicar no card -->
                            <h:inputHidden id="medicoSelecionadoId"
                                           value="#{agendamentoBean.medicoId}" />

                            <div class="doctors-list" id="doctorsList">
                                <ui:repeat value="#{agendamentoBean.listaMedicos}" var="medico">
                                    <div class="doctor-card"
                                         onclick="selecionarMedico(this, '#{medico.id}')"
                                         data-nome="#{medico.nome}">
                                        <div class="doctor-header">
                                            <div class="doctor-avatar">MD</div>
                                            <div class="doctor-info">
                                                <h4>#{medico.nome}</h4>
                                                <p class="doctor-specialty">#{medico.especialidade}</p>
                                            </div>
                                        </div>
                                        <div class="doctor-details">
                                            <span>📍 #{medico.localizacao}</span>
                                            <span>⭐ 5.0</span>
                                        </div>
                                    </div>
                                </ui:repeat>
                            </div>
                        </div>

                        <!-- ── STEP 3: DADOS DO PACIENTE ── -->
                        <div class="form-step" id="step3">
                            <h3>Seus Dados</h3>

                            <div class="form-group">
                                <label>Nome Completo</label>
                                <!-- MUDOU: paciente.nome → pacienteNome -->
                                <h:inputText id="patientName"
                                             value="#{agendamentoBean.pacienteNome}"
                                             styleClass="form-control"
                                             p:placeholder="Digite seu nome" />
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>CPF</label>
                                    <!-- MUDOU: paciente.cpf → pacienteCpf -->
                                    <h:inputText id="patientCPF"
                                                 value="#{agendamentoBean.pacienteCpf}"
                                                 styleClass="form-control mask-cpf"
                                                 p:placeholder="000.000.000-00"
                                                 p:maxlength="14" />
                                </div>
                                <div class="form-group">
                                    <label>Telefone</label>
                                    <!-- MUDOU: paciente.telefone → pacienteTelefone -->
                                    <h:inputText id="patientPhone"
                                                 value="#{agendamentoBean.pacienteTelefone}"
                                                 styleClass="form-control mask-phone"
                                                 p:placeholder="(00) 00000-0000"
                                                 p:maxlength="15" />
                                </div>
                                <div class="form-group">
                                    <label>Data de Nascimento</label>
                                    <!-- MUDOU: paciente.dataNascimento → pacienteNascimento -->
                                    <h:inputText id="patientBirthDate"
                                                 value="#{agendamentoBean.pacienteNascimento}"
                                                 styleClass="form-control mask-date"
                                                 p:placeholder="00/00/0000"
                                                 p:maxlength="10" />
                                </div>
                                <div class="form-group">
                                    <label>Sexo Biológico</label>
                                    <!-- MUDOU: paciente.sexo → pacienteSexo -->
                                    <h:selectOneMenu id="patientSex"
                                                     value="#{agendamentoBean.pacienteSexo}"
                                                     styleClass="form-control">
                                        <f:selectItem itemValue="" itemLabel="Selecione..." />
                                        <f:selectItem itemValue="masculino" itemLabel="Masculino" />
                                        <f:selectItem itemValue="feminino"  itemLabel="Feminino" />
                                    </h:selectOneMenu>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Observações (Opcional)</label>
                                <h:inputTextarea id="observations"
                                                 value="#{agendamentoBean.observacoes}"
                                                 styleClass="form-control"
                                                 rows="3"
                                                 p:placeholder="Alguma observação?" />
                            </div>
                        </div>

                        <!-- ── AÇÕES ── -->
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary"
                                    id="prevBtn" disabled="disabled">← Voltar</button>
                            <button type="button" class="btn btn-primary"
                                    id="nextBtn">Próximo →</button>

                            <!-- Botão invisível — o JS clica nele pra disparar o submit JSF -->
                            <h:commandButton id="btnSubmeterJSF"
                                             value="Prosseguir ✓"
                                             action="#{agendamentoBean.salvarAgendamento}"
                                             styleClass="btn btn-success"
                                             style="display: none;" />

                            <!-- Botão visual — o usuário vê e clica, o JS dispara o de cima -->
                            <button type="button" class="btn btn-success"
                                    id="submitBtnVisual" style="display: none;">
                                Prosseguir ✓
                            </button>
                        </div>

                    </div>
                </section>

                <h:messages showDetail="true" showSummary="true" tooltip="true"
                            style="color:red;font-weight:bold;border:1px solid red;padding:10px;" />

            </h:form>

            <h:outputScript library="js" name="Paciente.js" />
            <h:outputScript library="js" name="AgendarConsulta.js" />

        </ui:define>
    </ui:composition>
</html>
