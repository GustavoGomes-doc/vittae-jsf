<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough" lang="pt-BR">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vittae | Login</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <h:outputStylesheet library="css" name="login.css" />
    <link rel="shortcut icon"
        href="#{request.contextPath}/resources/imagens/facicon VITTAE.png"
        type="image/x-icon" />
</h:head>

<h:body style="display:flex; justify-content:center; align-items:center; min-height:100vh;">

    <section class="container-pai" id="mainContainer" style="max-width:850px;">
        <div class="forms-content-container">
            <div class="form-content sign-in" id="loginBlock">
                <h:form id="loginForm" prependId="false">
                    <h2>Acesse sua Conta</h2>
                    <p class="subtitle">Bem-vindo de volta ao Vittae!</p>

                    <div class="input-field">
                        <i class="fas fa-id-card" />
                        <h:inputText id="cpfLogin" value="#{loginBean.cpf}"
                            pt:placeholder="CPF (000.000.000-00)"
                            required="true"
                            requiredMessage="CPF é obrigatório"
                            styleClass="form-control"
                            maxlength="14"
                            onkeyup="mascaraCPF(this)" />
                    </div>

                    <div class="input-field">
                        <i class="fas fa-lock" />
                        <h:inputSecret id="senhaLogin" value="#{loginBean.senha}"
                            pt:placeholder="Sua Senha"
                            required="true"
                            requiredMessage="Senha é obrigatória"
                            styleClass="form-control" />
                    </div>

                    <h:commandLink value="Esqueceu sua senha?"
                        styleClass="forgot-pass"
                        action="#{loginBean.recuperarSenha()}">
                        <f:ajax execute="@this" render="messages" />
                    </h:commandLink>

                    <h:commandButton value="Entrar"
                        action="#{loginBean.login()}"
                        styleClass="btn-main" />

                    <div class="footer-copy">
                        <p>©Copyright 2026 Vittae.</p>
                    </div>

                    <h:messages id="messages" globalOnly="false"
                        style="color:#e74c3c; list-style:none; padding:0;
                               font-size:13px; margin-top:10px;" />
                </h:form>
            </div>
        </div>

        <div class="overlay-panel-container">
            <div class="overlay">
                <div class="overlay-section overlay-right">
                    <h2>Novo por aqui?</h2>
                    <p>Crie sua conta em segundos e agende suas consultas com total praticidade.</p>
                    <h:link value="Criar Conta"
                        outcome="/views/cadastrar/cadastrar.xhtml"
                        styleClass="btn-outline"
                        style="text-decoration:none; display:inline-block;
                               text-align:center; line-height:45px;" />
                </div>
            </div>
        </div>
    </section>

    <script type="text/javascript">
    //<![CDATA[

    // Máscara CPF
    function mascaraCPF(campo) {
        var v = campo.value.replace(/\D/g, "").substring(0, 11);
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        campo.value = v;
    }

    // Injeta o olho em todos os campos de senha
    document.addEventListener('DOMContentLoaded', function () {
        var senhas = document.querySelectorAll('input[type="password"]');
        senhas.forEach(function (input) {
            var wrapper = input.parentNode;
            wrapper.style.position = 'relative';
            input.style.paddingRight = '42px';

            var btn = document.createElement('button');
            btn.type = 'button';
            btn.setAttribute('tabindex', '-1');
            btn.style.cssText = 'position:absolute;right:10px;top: 3px;' +
            'background:none;border:none;' +
            'cursor:pointer;color:#aaa;font-size:15px;z-index:99;padding:0;';
            btn.innerHTML = '<i class="fas fa-eye"></i>';

            btn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                var icone = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icone.classList.replace('fa-eye', 'fa-eye-slash');
                    btn.style.color = '#7c3aed';
                } else {
                    input.type = 'password';
                    icone.classList.replace('fa-eye-slash', 'fa-eye');
                    btn.style.color = '#aaa';
                }
            });

            wrapper.appendChild(btn);
        });
    });

    //]]>
    </script>

</h:body>
</html>
